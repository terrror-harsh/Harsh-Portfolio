<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title description">
  <title id="title">Hackathon achievement demo artwork</title>
  <desc id="description">Abstract dark event stage with orange lights, clearly marked as demo artwork to be replaced.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#171117"/>
      <stop offset="1" stop-color="#09090c"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop stop-color="#f15a24" stop-opacity=".46"/>
      <stop offset="1" stop-color="#f15a24" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#background)"/>
  <ellipse cx="850" cy="130" rx="420" ry="290" fill="url(#glow)"/>
  <path d="M0 525 280 375l250 118 245-203 425 235v150H0Z" fill="#21191c"/>
  <path d="M0 565 280 415l250 118 245-203 425 235v110H0Z" fill="#0d0c10" opacity=".8"/>
  <circle cx="865" cy="188" r="82" fill="#f15a24" opacity=".16"/>
  <circle cx="865" cy="188" r="48" fill="#f15a24" opacity=".22"/>
  <rect x="64" y="64" width="1072" height="547" rx="24" fill="none" stroke="#f4f0eb" stroke-opacity=".16" stroke-width="2"/>
  <text x="100" y="151" fill="#f15a24" font-family="Arial, sans-serif" font-size="22" letter-spacing="6">HACKATHONS &amp; IDEATHONS</text>
  <text x="100" y="300" fill="#f4f0eb" font-family="Arial, sans-serif" font-size="68" font-weight="700">Your event photo</text>
  <text x="103" y="352" fill="#b9b0aa" font-family="Arial, sans-serif" font-size="27">Replace this demo artwork with your achievement image.</text>
  <rect x="100" y="418" width="180" height="52" rx="26" fill="#f15a24"/>
  <text x="190" y="452" fill="#171313" font-family="Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle">DEMO IMAGE</text>
</svg>
