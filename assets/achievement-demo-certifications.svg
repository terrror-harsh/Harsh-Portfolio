<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title description">
  <title id="title">Certification image demo artwork</title>
  <desc id="description">Abstract certificate card in a dark gallery, clearly marked as demo artwork to be replaced.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#171317"/>
      <stop offset="1" stop-color="#09090c"/>
    </linearGradient>
    <linearGradient id="certificate" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#28201e"/>
      <stop offset="1" stop-color="#171416"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#background)"/>
  <circle cx="865" cy="330" r="260" fill="#f15a24" opacity=".08"/>
  <rect x="672" y="115" width="385" height="445" rx="20" fill="url(#certificate)" stroke="#f4f0eb" stroke-opacity=".26" stroke-width="2"/>
  <rect x="705" y="149" width="319" height="377" rx="12" fill="none" stroke="#f15a24" stroke-opacity=".58" stroke-width="3"/>
  <path d="M864 219 884 260l45 7-33 32 8 45-40-22-40 22 8-45-33-32 45-7Z" fill="#f15a24" opacity=".82"/>
  <path d="M756 382h217M779 412h171M802 442h125" stroke="#b9b0aa" stroke-opacity=".65" stroke-linecap="round" stroke-width="7"/>
  <rect x="64" y="64" width="1072" height="547" rx="24" fill="none" stroke="#f4f0eb" stroke-opacity=".16" stroke-width="2"/>
  <text x="100" y="151" fill="#f15a24" font-family="Arial, sans-serif" font-size="22" letter-spacing="6">CERTIFICATIONS &amp; LEARNING</text>
  <text x="100" y="300" fill="#f4f0eb" font-family="Arial, sans-serif" font-size="62" font-weight="700">Your certificate</text>
  <text x="103" y="352" fill="#b9b0aa" font-family="Arial, sans-serif" font-size="27">Replace this demo artwork with your certificate image.</text>
  <rect x="100" y="418" width="180" height="52" rx="26" fill="#f15a24"/>
  <text x="190" y="452" fill="#171313" font-family="Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle">DEMO IMAGE</text>
</svg>
